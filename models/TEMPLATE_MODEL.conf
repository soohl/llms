# Copy to models/<Model-Name>/model.conf.
MODEL_ID=explicit-model-name
MODEL_NAME='Readable model name'

BACKEND=backend-adapter
COMPAT_PROFILE=backend-model-profile

TARGET_HF_REPO=owner/repository
TARGET_HF_REVISION=full-repository-commit
# SPECULATIVE_HF_REPO=owner/draft-repository
# SPECULATIVE_HF_REVISION=full-draft-repository-commit
# PROJECTOR_HF_REPO=owner/projector-repository
# PROJECTOR_HF_REVISION=full-projector-repository-commit
VARIANTS='variant'
DEFAULT_VARIANT=variant

# Convert the variant to uppercase and replace non-alphanumeric characters
# with underscores when forming its DOWNLOAD_<VARIANT> variable prefix.
DOWNLOAD_VARIANT_FILE='model.gguf'
DOWNLOAD_VARIANT_SIZE=expected-size-in-bytes
DOWNLOAD_VARIANT_SHA256=expected-sha256

# Use these when all variants share one speculative model.
DOWNLOAD_SPECULATIVE_FILE='draft.gguf'
DOWNLOAD_SPECULATIVE_SIZE=expected-size-in-bytes
DOWNLOAD_SPECULATIVE_SHA256=expected-sha256

# Use these when all variants share one vision projector.
DOWNLOAD_PROJECTOR_FILE='mmproj.gguf'
DOWNLOAD_PROJECTOR_SIZE=expected-size-in-bytes
DOWNLOAD_PROJECTOR_SHA256=expected-sha256

# A variant-specific speculative model overrides the shared one:
# DOWNLOAD_VARIANT_SPECULATIVE_FILE='variant-draft.gguf'
# DOWNLOAD_VARIANT_SPECULATIVE_SIZE=expected-size-in-bytes
# DOWNLOAD_VARIANT_SPECULATIVE_SHA256=expected-sha256

# Add backend-specific tuned values, for example:
# LLAMACPP_CONTEXT=8192
# LLAMACPP_BATCH=2048
# LLAMACPP_UBATCH=512
# LLAMACPP_CACHE_TYPE=f16
# LLAMACPP_PROJECTOR_FILE=mmproj.gguf

# Models can share a weights directory, relative to their model directory.
# MODEL_GGUF_DIR=../Related-Model/gguf

# The served API alias defaults to MODEL_ID. Override only when needed.
# API_MODEL_ID=api-model-name
# MODEL_REASONING=1
